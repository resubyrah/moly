<style>
  :root {
    font-family: "SF Mono", "Courier New", ui-monospace, monospace;
    background:#191713; color:#e8e2d4;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; padding:16px; max-width:520px; margin-inline:auto;
         background:linear-gradient(180deg,#191713 0%,#242017 100%); }

  /* ---------- Chrome / deck ---------- */
  .deck { background:linear-gradient(180deg,#3b3428,#2c271f 60%,#241f18);
          border:2px solid #4d4433; border-radius:18px; padding:18px 16px 16px;
          box-shadow:0 10px 24px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,240,200,.18); }
  .brandbar { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .brand { font-size:1.05rem; letter-spacing:.35em; color:#e8c46a; font-weight:700; text-shadow:0 1px 0 #000; }
  .brand small { letter-spacing:.12em; color:#a89b7d; font-size:.6rem; display:block; }
  .settingsbtn { background:none; border:1px solid #6a5c44; color:#cdbf9c; border-radius:6px;
                 padding:4px 8px; cursor:pointer; font:inherit; font-size:.75rem; }
  .settingsbtn:active { transform:translateY(1px); }
  .iconbtn { background:none; border:1px solid #6a5c44; border-radius:6px; padding:3px 7px;
             cursor:pointer; font:inherit; font-size:.95rem; color:#8a7c60; line-height:1.2; }
  .iconbtn.active { color:#5aa5e0; border-color:#3a5a75; box-shadow:0 0 6px rgba(90,165,224,.35); }
  .iconbtn:disabled { opacity:.3; cursor:default; }
  .iconbtn:active { transform:translateY(1px); }

  /* ---------- Cassette window ---------- */
  .cassette { background:linear-gradient(180deg,#161310,#0d0b08);
              border-radius:12px; padding:16px 16px 14px; box-shadow:inset 0 2px 8px #000;
              border:3px solid #4d4433; outline:1px solid #000; }
  .tape-label { background:linear-gradient(180deg,#f4ecd7,#e2d6b8); color:#3a3020; border-radius:4px;
                padding:7px 12px; text-align:center; font-size:1.05rem; font-weight:700; letter-spacing:.04em;
                overflow-wrap:anywhere; margin-bottom:6px; box-shadow:0 1px 0 rgba(255,255,255,.4) inset; }
  .counter { position:relative; text-align:center; color:#c46a2b; font-size:1rem; letter-spacing:.2em;
             text-shadow:0 0 6px rgba(255,120,30,.55); margin-bottom:2px; }
  .counter .dur { color:#8a7c60; letter-spacing:.05em; text-shadow:none; }
  .counter .iconbtn { position:absolute; right:0; top:50%; transform:translateY(-50%); letter-spacing:0;
                      border:none; background:none; padding:2px; }
  .reelbay { position:relative; height:132px; margin:16px 0 8px; }
  .reel { position:absolute; top:50%; transform:translateY(-50%); width:104px; height:104px; border-radius:50%;
          background:radial-gradient(circle,#e5d9b8 0%,#c9b98a 40%,#8f7d52 100%);
          border:6px solid #2a2318; box-shadow:0 2px 8px #000, inset 0 0 0 1px rgba(255,240,200,.25); }
  .reel.left { left:calc(25% - 52px); }
  .reel.right { left:calc(75% - 52px); }
  .reel::before, .reel::after { display:none; }
  .reel .pile { position:absolute; inset:0; margin:auto; width:var(--d,50px); height:var(--d,50px);
                border-radius:50%; background:radial-gradient(circle at 35% 30%,#4a2f1c,#2a1a10 70%);
                box-shadow:inset 0 0 4px rgba(0,0,0,.6); transition:width .4s, height .4s; }
  .reel .hub { position:absolute; inset:0; margin:auto; width:28px; height:28px; border-radius:50%; z-index:4;
               background:conic-gradient(#d8d8de,#9a9aa2,#e2e2e8,#8a8a92,#d8d8de);
               border:2px solid #55555e; box-shadow:0 1px 3px #000; }
  .taperoad { position:absolute; top:50%; transform:translateY(-50%);
               left:calc(25% + 58px); right:calc(25% + 58px);
               display:flex; align-items:center; justify-content:center; gap:6px; }
  .strip { height:12px; flex:1; border-radius:2px;
           background:linear-gradient(180deg,#4a2f1c,#2a1a10); box-shadow:0 1px 2px #000; }
  .spin { animation:spin 3.2s linear infinite; }
  @keyframes spin {
    from { transform:translateY(-50%) rotate(0deg); }
    to   { transform:translateY(-50%) rotate(360deg); }
  }
  .cassette .pile { z-index:1; }
  input[type=range] { width:100%; accent-color:#e8c46a; margin-top:8px; }

  /* ---------- VU meter ---------- */
  .vu { display:flex; justify-content:center; gap:10px; margin-top:10px; }
  .vuch { display:flex; gap:3px; align-items:flex-end; height:44px; padding:5px 7px;
          background:linear-gradient(180deg,#161310,#0d0b08); border:1px solid #000;
          border-radius:6px; box-shadow:inset 0 2px 6px #000; }
  .vuch span { width:5px; height:5px; border-radius:1px; background:#3a2f1a; transition:background .08s, height .08s; }
  .vuch span.on { background:#e8c46a; }
  .vuch span:nth-last-child(1).on, .vuch span:nth-last-child(2).on { background:#e06a2b; }
  .vuch span:nth-last-child(1).on { background:#d94f3d; }

  /* ---------- Transport buttons ---------- */
  .transport { display:flex; justify-content:center; gap:12px; margin-top:14px; }
  .tbtn { font:inherit; font-size:.7rem; letter-spacing:.05em; color:#e8e2d4; cursor:pointer;
          background:linear-gradient(180deg,#57503f,#39332a); border:1px solid #6a5c44;
          border-radius:8px; padding:10px 8px; min-width:52px; text-align:center;
          box-shadow:0 4px 0 #191510, inset 0 1px 0 rgba(255,240,200,.22);
          user-select:none; }
  .tbtn:active { transform:translateY(3px); box-shadow:0 1px 0 #191510; }
  .tbtn .glyph { display:block; font-size:1.35rem; line-height:1; margin-bottom:3px; color:#e8c46a; }
  .tbtn.primary { background:linear-gradient(180deg,#7a5f22,#5c4718); border-color:#a8842e; }
  .tbtn.balloon-btn { min-width:52px; }

  /* ---------- Playlist / tape select ---------- */
  .tapebox { margin-top:14px; }
  .tapenav { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .tapenav .name { text-align:center; font-size:.85rem; color:#cdbf9c; letter-spacing:.06em;
                   overflow-wrap:anywhere; flex:1; }
  .smallbtn { font:inherit; font-size:.7rem; letter-spacing:.05em; background:#39332a; color:#cdbf9c;
              border:1px solid #6a5c44; border-radius:6px; padding:5px 9px; cursor:pointer; }
  .smallbtn:active { transform:translateY(1px); }
  .list { max-height:34vh; overflow:auto; background:#12100c; border:1px solid #36301f;
          border-radius:10px; padding:6px; }
  .track { display:flex; justify-content:space-between; gap:10px; padding:8px 10px; border-radius:6px;
           cursor:pointer; font-size:.85rem; color:#b8ac91; }
  .track:hover { background:#241f15; }
  .track.active { background:#33280f; color:#e8c46a; }
  .track .len { color:#776b52; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hidden { display:none !important; }

  /* ---------- Sheets / overlays ---------- */
  .overlay { position:fixed; inset:0; background:rgba(10,8,5,.7); display:flex;
             align-items:center; justify-content:center; padding:16px; z-index:10; }
  .sheet { background:#2c271f; border:1px solid #5c5138; border-radius:14px; padding:16px;
           width:100%; max-width:400px; max-height:80vh; overflow:auto;
           box-shadow:0 12px 30px rgba(0,0,0,.6); }
  .sheet h3 { margin:0 0 8px; color:#e8c46a; letter-spacing:.05em; }
  .sub { color:#a89b7d; font-size:.8rem; margin-bottom:12px; }
  input[type=text], input:not([type]) { width:100%; padding:10px 12px; border-radius:8px; margin-bottom:8px;
          border:1px solid #6a5c44; background:#191510; color:#e8e2d4; font:inherit; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { font:inherit; cursor:pointer; border:1px solid #6a5c44; background:#57503f; color:#e8e2d4;
         border-radius:8px; padding:9px 13px; }
  .btn.primary { background:#e8c46a; color:#241f15; border-color:#a8842e; font-weight:700; }
  .btn:active { transform:translateY(1px); }

  .comment { padding:6px 8px; border-radius:6px; font-size:.85rem; color:#b8ac91; }
  .comment .ts { color:#e8c46a; font-weight:700; margin-right:6px; font-variant-numeric:tabular-nums; }
  .comment.hl { background:#44350f; outline:2px solid #e8c46a; color:#e8e2d4; }

  .msg { font-size:.75rem; padding:5px 8px; border-radius:6px; margin-top:8px; }
  .msg.ok { background:#2c4a2a; color:#a7d9a0; }
  .msg.err { background:#5a2222; color:#f0b0a0; }
  details summary { cursor:pointer; color:#a89b7d; margin-bottom:8px; }
  label { display:block; font-size:.72rem; color:#a89b7d; letter-spacing:.05em; margin-top:6px; }
</style>
</head>
<body>
  <div class="deck" id="deck">
    <div class="brandbar">
      <div class="brand" style="align-items:center; display:flex; gap:8px">
        <img alt="cassette" style="width:22px; height:22px; display:block" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2322201c'/%3E%3Crect x='6' y='14' width='52' height='36' rx='5' fill='%23e8c46a'/%3E%3Ccircle cx='22' cy='32' r='8' fill='%23241f15'/%3E%3Ccircle cx='42' cy='32' r='8' fill='%23241f15'/%3E%3Ccircle cx='22' cy='32' r='3' fill='%23e8c46a'/%3E%3Ccircle cx='42' cy='32' r='3' fill='%23e8c46a'/%3E%3Crect x='14' y='48' width='36' height='4' rx='2' fill='%23241f15'/%3E%3C/svg%3E" />
        <span id="brandDate" style="letter-spacing:.02em; font-size:.9rem">Mono Lisa</span>

    <div class="transport">

  <!-- Settings modal -->
  <div class="overlay hidden" id="setupOverlay">

      <h3>Setup</h3>

        <input id="apiKey" placeholder="AIza..." />

  <!-- Error / status bar (independent of setup) -->
  <div id="errorBar" class="msg err hidden" style="position:fixed; left:16px; right:16px; bottom:14px; z-index:20; max-width:488px; margin-inline:auto"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  tenant:           "Mono Lisa",
  folderUrl:        "https://drive.google.com/drive/folders/1ZRtriefc0mwkHHtKxWTmTrQnQs3DHPq0",
  publicFolderUrl:  "https://drive.google.com/drive/folders/1nxTjGqAdec-XN1sBe4S6AfpPYQUSGXCF",
  apiKey:           "AIzaSyCtyBR39w4_5-gVkl7ytSyZ2Hf1fHEOYb0",
  clientId:         "513652605614-a84dqbd2n2h0b8nj5p4o0sp8b7ar6gtl.apps.googleusercontent.com",
};

const APP_VERSION = "1.2";

const state = {
  apiKey: "", clientId: "",
  privRoot: null, pubRoot: null,
  mode: "public",                     // "public" = only public tapes, "mixed" = private + public
  folders: [], folderIdx: -1,        // each folder: {id, name, origin: "priv"|"pub"}
  files: [], fileIdx: -1,
  comments: [], commentsFileId: null,
  token: null,
};
const audio = new Audio();
audio.preload = "auto";

/* ---------- Setup / storage ---------- */
for (const [k, id, cfg] of [
  ["mlFolder","folderUrl","folderUrl"],
  ["mlPubFolder","publicFolderUrl","publicFolderUrl"],
  ["mlKey","apiKey","apiKey"],
  ["mlClient","clientId","clientId"],
]) {
  const cfgVal = CONFIG[cfg] && !CONFIG[cfg].startsWith("HIER-JOUW-") ? CONFIG[cfg] : "";
  const v = localStorage.getItem(k) || cfgVal; if (v) $(id).value = v;
}
$("btnStart").addEventListener("click", () => { saveSetup(); begin(); });
$("btnRandom").addEventListener("click", async () => {
  if (!state.folders.length) return begin();
  const idx = Math.floor(Math.random() * state.folders.length);
  await loadFolder(idx, "shuffle");
});
$("btnLogin").addEventListener("click", async () => {
  try {
    if (!state.token) {
      state.token = await getToken();
      saveToken(state.token);
    }
    state.mode = "mixed";
    await refreshTapes();
  } catch (e) { msg("Sign-in failed: " + e.message, false); }
});
$("btnMode").addEventListener("click", async () => {
  state.mode = "public";
  await refreshTapes();
});
async function refreshTapes() {
  const oldIdx = state.folderIdx;
  await loadFolderList();
  await loadFolder(oldIdx >= 0 && oldIdx < state.folders.length ? oldIdx : 0);
  updateBalloon();
}

function saveSetup() {
  localStorage.setItem("mlFolder", $("folderUrl").value);
  localStorage.setItem("mlPubFolder", $("publicFolderUrl").value);
  localStorage.setItem("mlKey", $("apiKey").value);
  localStorage.setItem("mlClient", $("clientId").value);
}
function msg(text, ok) {
  const m = $("errorBar");
  m.textContent = text;
  m.className = "msg " + (ok ? "ok" : "err");
  clearTimeout(msg._t);
  msg._t = setTimeout(() => m.classList.add("hidden"), ok ? 4000 : 12000);  // auto-hide
}
window.addEventListener("error", (e) => { try { msg("Error: " + e.message, false); } catch (_) {} });
window.addEventListener("unhandledrejection", (e) => { try { msg("Error: " + (e.reason && e.reason.message || e.reason), false); } catch (_) {} });

/* ---------- Title cleaning ---------- */
function cleanTitle(name) {
  let t = name.replace(/\.[^.]+$/, "");                     // drop extension
  t = t.replace(/^(kopie van|copy of)\s*/i, "");            // drop copy prefix
  t = t.split("+")[0];                                     // hide suffix starting with '+'
  t = t.trim().replace(/[\s_-]+$/, "");                     // trailing junk
  t = t.replace(/[-_]+/g, " ");                             // dashes/underscores as spaces
  t = t.replace(/\s+/g, " ").trim();
  if (t) t = t[0].toUpperCase() + t.slice(1);               // first letter uppercase
  return t || name.replace(/\.[^.]+$/, "");
}
function fmtTime(s) {
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60);
  return (m >= 60 ? Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0") : m) + ":" + String(s % 60).padStart(2, "0");
}
function trackLen(file) {
  const d = localStorage.getItem("mlDur_" + file.id);
  return d ? fmtTime(parseInt(d, 10)) : "";
}
function rememberLen(file) {
  if (isFinite(audio.duration) && audio.duration > 0)
    localStorage.setItem("mlDur_" + file.id, String(Math.round(audio.duration)));
}

/* ---------- Drive helpers ---------- */
function parseFolderId(s) {
  s = (s || "").trim();
  if (!s) return null;
  const m = s.match(/folders\/([a-zA-Z0-9_-]+)/) || s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : (/^[a-zA-Z0-9_-]{20,}$/.test(s) ? s : null);
}
async function driveGet(path, origin) {
  const headers = {};
  let url = "https://www.googleapis.com/drive/v3/" + path;
  if (origin === "priv") {
    if (!state.token) throw new Error("Not signed in");
    headers["Authorization"] = "Bearer " + state.token;
  } else {
    if (!state.apiKey) throw new Error("No API key configured");
    url += (path.includes("?") ? "&" : "?") + "key=" + state.apiKey;
  }
  const r = await fetch(url, { headers });
  if (r.status === 401 && state.token) {
    clearToken();
    throw new Error("Session expired — please sign in again.");
  }
  if (!r.ok) throw new Error("Drive error " + r.status + ": " + (await r.text()).slice(0, 200));
  return r.json();
}
async function listChildren(folderId, q, origin, orderBy) {
  const params = "q=" + encodeURIComponent(q.replace("PARENT", folderId)) +
    "&fields=files(id,name,modifiedTime,mimeType)&pageSize=200" +
    (orderBy ? "&orderBy=" + encodeURIComponent(orderBy) : "");
  const res = await driveGet("files?" + params, origin);
  return res.files || [];
}

/* ---------- Startup / tape loading ---------- */
function readConfigInputs() {
  state.apiKey = $("apiKey").value.trim();
  state.clientId = $("clientId").value.trim();
  state.privRoot = parseFolderId($("folderUrl").value);
  state.pubRoot = parseFolderId($("publicFolderUrl").value);
}
function updateBalloon() {
  $("btnComment").classList.toggle("hidden", !state.token);
  const m = $("btnMode");
  m.classList.toggle("active", state.mode === "public" || !state.token);
  m.disabled = !!state.token;                     // signed in → private mode is on, globe disabled
  m.title = state.token ? "Signed in — showing your private tapes" :
            (state.mode === "public" ? "Public mode — public tapes only" : "Public tapes");
  const k = $("btnLogin");
  k.disabled = !!(state.token && state.mode !== "public");   // already where the key leads
  k.title = state.token ? "Back to private mode (all tapes)" : "Sign in with Google for private tapes";
  $("btnRandom").disabled = state.folders.length < 2;       // shuffle needs more than one tape
}
async function begin() {
  readConfigInputs();
  if (!state.privRoot && !state.pubRoot) { openSetup(); msg("Enter at least one folder URL.", false); return; }
  if (state.pubRoot && !state.apiKey) { openSetup(); msg("The public folder needs an API key.", false); return; }
  if (state.privRoot && !state.token && !state.clientId) { openSetup(); msg("The private folder needs a Client ID.", false); return; }
  $("loginOverlay").classList.add("hidden");
  try {
    await loadFolderList();
    if (!state.folders.length) throw new Error("No playable folders found (is the folder shared / does it contain audio?).");
    // Signed in → start with the newest private tape ('Mixes YYMMDD'); otherwise the first public one
    let startIdx = 0;
    if (state.token) {
      const i = state.folders.findIndex((f) => f.origin === "priv");
      if (i >= 0) startIdx = i;
    }
    await loadFolder(startIdx);
  } catch (e) { msg(e.message, false); }
  updateBalloon();
}
function autoStart() {
  readConfigInputs();
  const tok = getSavedToken();
  if (tok) { state.token = tok; state.mode = "mixed"; begin(); return; }
  if (state.privRoot && state.clientId) { $("loginOverlay").classList.remove("hidden"); return; }
  begin();
}
async function loadFolderList() {
  const all = [];
  if (state.pubRoot) {
    let pubs = await listChildren(state.pubRoot,
      "'PARENT' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false",
      "pub", "modifiedTime desc");
    if (!pubs.length) pubs = [{ id: state.pubRoot, name: "Public", modifiedTime: new Date().toISOString() }];
    pubs.forEach((f) => all.push({ ...f, origin: "pub" }));
  }
  if (state.privRoot && state.token && state.mode !== "public") {
    let privs = await listChildren(state.privRoot,
      "'PARENT' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false",
      "priv", "modifiedTime desc");
    if (!privs.length) privs = [{ id: state.privRoot, name: "Mixes", modifiedTime: new Date().toISOString() }];
    // Sort by date in the name ('Mixes YYYYMMDD', suffixes ignored) — newest first
    const dateKey = (n) => { const m = (n || "").match(/(\d{8})/); return m ? m[1] : ""; };
    privs.sort((a, b) => dateKey(b.name).localeCompare(dateKey(a.name)) || (b.modifiedTime || "").localeCompare(a.modifiedTime || ""));
    privs.forEach((f) => all.push({ ...f, origin: "priv" }));
  }
  state.folders = all;
  $("btnRandom").disabled = all.length < 2;
}
async function loadFolder(idx, startAt) {
  if (!state.folders.length) return;
  state.folderIdx = ((idx % state.folders.length) + state.folders.length) % state.folders.length;
  const folder = state.folders[state.folderIdx];
  $("brandDate").textContent = cleanTitle(folder.name);   // tape/folder next to the cassette icon
  $("brandDate").title = folder.name;
  $("btnPrevList").disabled = state.folderIdx <= 0 && state.folders.length <= 1;
  $("btnNextList").disabled = state.folderIdx >= state.folders.length - 1 && state.folders.length > 1;
  $("btnPrevList").classList.toggle("hidden", state.folders.length <= 1);
  $("btnNextList").classList.toggle("hidden", state.folders.length <= 1);
  state.files = (await listChildren(folder.id,
    "'PARENT' in parents and mimeType contains 'audio' and trashed=false",
    folder.origin))
    .sort((a, b) => (b.modifiedTime || "").localeCompare(a.modifiedTime || ""));  // newest edit first
  renderTrackList();
  await loadComments(folder);
  if (state.files.length) {
    let start = 0;
    if (startAt === "shuffle") start = Math.floor(Math.random() * state.files.length);
    else if (Number.isInteger(startAt) && startAt >= 0 && startAt < state.files.length) start = startAt;
    await playTrack(start);
  }
}
function renderTrackList() {
  const el = $("trackList"); el.innerHTML = "";
  state.files.forEach((f, i) => {
    const d = document.createElement("div");
    d.className = "track" + (i === state.fileIdx ? " active" : "");
    const span = document.createElement("span");
    span.textContent = cleanTitle(f.name);
    const len = document.createElement("span");
    len.className = "len"; len.textContent = trackLen(f);
    d.appendChild(span); d.appendChild(len);
    d.onclick = () => playTrack(i);
    el.appendChild(d);
    if (i === state.fileIdx) {   // seek slider directly under the playing track
      const row = document.createElement("div");
      row.style.cssText = "display:flex; align-items:center; gap:8px; padding:2px 10px 8px; font-size:.7rem; color:#8a7c60";
      const cur = document.createElement("span");
      cur.id = "miniPos"; cur.textContent = fmtTime(audio.currentTime);
      const s = document.createElement("input");
      s.type = "range"; s.id = "miniSeek"; s.min = 0; s.max = 100; s.value = 0; s.style.flex = "1";
      s.style.accentColor = "#e8c46a"; s.style.height = "4px";
      const tot = document.createElement("span");
      tot.id = "miniTot"; tot.textContent = trackLen(f);
      s.addEventListener("input", () => {
        if (isFinite(audio.duration)) audio.currentTime = (s.value / 100) * audio.duration;
      });
      row.appendChild(cur); row.appendChild(s); row.appendChild(tot);
      el.appendChild(row);
    }
  });
}

/* ---------- Audio ---------- */
async function playTrack(i) {
  const f = state.files[i]; if (!f) return;
  const folder = state.folders[state.folderIdx];
  state.fileIdx = i; renderTrackList();
  updateTapePiles();
  $("trackName").textContent = cleanTitle(f.name);
  $("trackDurWrap").textContent = trackLen(f) ? "/ " + trackLen(f) : "";
  try {
    const url = await fetchAudioUrl(f.id, folder.origin);
    audio.src = url;
    await audio.play();
    setPlaying(true);
    updateMediaSession();
  } catch (e) {
    setPlaying(false);
    msg("Cannot load track (" + (e.message || e) + ").", false);
  }
}
async function fetchAudioUrl(fileId, origin) {
  const headers = {};
  let url = "https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media";
  if (origin === "priv") {
    if (!state.token) throw new Error("not signed in");
    headers["Authorization"] = "Bearer " + state.token;
  } else {
    url += "&key=" + state.apiKey;
  }
  const r = await fetch(url, { headers });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const blob = await r.blob();
  if (blob.size < 1024) throw new Error("file too small / no access");
  return URL.createObjectURL(blob);
}
function setPlaying(p) {
  $("ppGlyph").textContent = p ? "⏸" : "▶";
  $("ppTxt").textContent = p ? "PAUSE" : "PLAY";
  document.querySelectorAll(".reel").forEach((r) => r.classList.toggle("spin", p));
}
audio.addEventListener("ended", () => {
  if (state.fileIdx < state.files.length - 1) playTrack(state.fileIdx + 1);
  else if (state.folderIdx < state.folders.length - 1) loadFolder(state.folderIdx + 1);
});
audio.addEventListener("loadedmetadata", () => {
  if (isFinite(audio.duration)) {
    $("trackDurWrap").textContent = "/ " + fmtTime(audio.duration);
    rememberLen(state.files[state.fileIdx]);
    renderTrackList();
  }
});
/* ---------- Tape progress: pile moves from left reel to right reel ---------- */
function tapeProgress() {
  const n = state.files.length;
  if (!n) return 0;
  const cur = isFinite(audio.duration) && audio.duration > 0 ? audio.currentTime / audio.duration : 0;
  return Math.min(1, (Math.max(0, state.fileIdx) + cur) / n);
}
function updateTapePiles() {
  const p = tapeProgress();
  // Left reel starts full and empties; right reel fills. Strong contrast so the move is clearly visible.
  $("pileL").style.setProperty("--d", (32 + (1 - p) * 52) + "px");  // supply reel empties
  $("pileR").style.setProperty("--d", (32 + p * 52) + "px");        // take-up reel fills
}
audio.addEventListener("timeupdate", () => {
  $("trackPos").textContent = fmtTime(audio.currentTime);
  const ms = $("miniSeek");
  if (ms && isFinite(audio.duration)) ms.value = (audio.currentTime / audio.duration) * 100;
  const mp = $("miniPos");
  if (mp) mp.textContent = fmtTime(audio.currentTime);
  if (isFinite(audio.duration)) { const sk = $("seek"); if (sk) sk.value = (audio.currentTime / audio.duration) * 100; }
  updateTapePiles();
});
$("seek") && $("seek").addEventListener("input", (e) => {
  if (isFinite(audio.duration)) audio.currentTime = (e.target.value / 100) * audio.duration;
});

/* ---------- Media Session: keep playing with screen off / other apps ---------- */
function updateMediaSession() {
  if (!("mediaSession" in navigator)) return;
  const f = state.files[state.fileIdx];
  if (!f) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: cleanTitle(f.name),
    artist: cleanTitle(state.folders[state.folderIdx] ? state.folders[state.folderIdx].name : ""),
    album: CONFIG.tenant || "Moly",
  });
  navigator.mediaSession.setActionHandler("play", () => { audio.play(); setPlaying(true); });
  navigator.mediaSession.setActionHandler("pause", () => { audio.pause(); setPlaying(false); });
  navigator.mediaSession.setActionHandler("previoustrack", () => {
    (state.fileIdx > 0) ? playTrack(state.fileIdx - 1) : stepTape(-1);
  });
  navigator.mediaSession.setActionHandler("nexttrack", () => {
    (state.fileIdx < state.files.length - 1) ? playTrack(state.fileIdx + 1) : stepTape(1);
  });
  try { navigator.mediaSession.setActionHandler("seekto", (d) => { if (d.seekTime != null) audio.currentTime = d.seekTime; }); } catch (e) {}
}
$("btnPlayPause").addEventListener("click", () => {
  if (!audio.src) return;
  if (audio.paused) { audio.play(); setPlaying(true); }
  else { audio.pause(); setPlaying(false); }
});
$("btnBack10").addEventListener("click", () => audio.currentTime = Math.max(0, audio.currentTime - 10));
$("btnFwd10").addEventListener("click", () => audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 10));
$("btnPrevList").addEventListener("click", () => stepTape(-1));
$("btnNextList").addEventListener("click", () => stepTape(1));
async function stepTape(dir) {
  // Meerdere tapes: wissel van tape. Eén tape: gebruik als vorige/volgende nummer.
  if (state.folders.length > 1) return loadFolder(state.folderIdx + dir);
  if (state.files.length < 2) return;
  const next = state.fileIdx + dir;
  if (next >= 0 && next < state.files.length) await playTrack(next);
}

/* ---------- VU meter (true stereo: splitter + 2 analysers) ---------- */
let vuRaf = null;
function startVU() {
  if (vuRaf) return;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (isIOS) return;  // iOS suspends WebAudio when the page hides; audio must stay on the element
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    if (ctx.state === "suspended") ctx.resume();
    const src = ctx.createMediaElementSource(audio);
    const splitter = ctx.createChannelSplitter(2);
    const anL = ctx.createAnalyser(), anR = ctx.createAnalyser();
    anL.fftSize = 256; anR.fftSize = 256;
    src.connect(splitter);
    splitter.connect(anL, 0);   // left channel
    splitter.connect(anR, 1);  // right channel
    anL.connect(ctx.destination, 0);
    anR.connect(ctx.destination, 0);
    const dL = new Uint8Array(anL.frequencyBinCount);
    const dR = new Uint8Array(anR.frequencyBinCount);
    const barsL = $("vuL").children, barsR = $("vuR").children;
    const level = (analyser, data) => {
      analyser.getByteFrequencyData(data);
      let s = 0; for (let i = 0; i < data.length; i++) s += data[i];
      return Math.min(1, (s / data.length / 255) * 1.6);
    };
    const paint = (bars, lvl) => {
      const n = bars.length, lit = Math.round(lvl * n);
      for (let i = 0; i < n; i++) bars[i].classList.toggle("on", i < lit && !audio.paused);
    };
    const draw = () => {
      paint(barsL, level(anL, dL));
      paint(barsR, level(anR, dR));
      vuRaf = requestAnimationFrame(draw);
    };
    vuRaf = requestAnimationFrame(draw);
  } catch (e) { /* VU meter optional */ }
}
audio.addEventListener("play", startVU);

/* ---------- Notes ---------- */
const MD_NAME = "opmerkingen.md";
async function loadComments(folder) {
  state.comments = []; state.commentsFileId = null;
  try {
    const files = await listChildren(folder.id, "'PARENT' in parents and name='" + MD_NAME + "'", folder.origin);
    if (files.length) {
      state.commentsFileId = files[0].id;
      const txt = await fetchFileText(files[0].id, folder.origin);
      state.comments = parseComments(txt);
    }
  } catch (e) { /* no notes file yet */ }
  const local = localStorage.getItem("mlComments_" + folder.id);
  if (local && !state.commentsFileId) state.comments = parseComments(local);
  renderComments(null);
}
async function fetchFileText(fileId, origin) {
  const headers = {};
  let url = "https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media";
  if (origin === "priv") { headers["Authorization"] = "Bearer " + state.token; }
  else { url += "&key=" + state.apiKey; }
  return (await fetch(url, { headers })).text();
}
function parseComments(md) {
  const out = [];
  for (const line of md.split(/\r?\n/)) {
    const m = line.match(/^\s*[-*]\s*\[(\d+):(\d+)\]\s*(.*)$/);
    if (m) out.push({ sec: parseInt(m[1]) * 60 + parseInt(m[2]), text: m[3].trim() });
  }
  return out.sort((a, b) => a.sec - b.sec);
}
function commentsAsMd() {
  return state.comments.map((c) => "- [" + fmtTime(c.sec) + "] " + c.text).join("\n") + "\n";
}
function renderComments(currentSec) {
  const wrap = $("commentList"); wrap.innerHTML = "";
  $("listCount").textContent = "(" + state.comments.length + ")";
  let hlIdx = -1;
  if (currentSec != null) state.comments.forEach((c, i) => { if (c.sec <= currentSec) hlIdx = i; });
  state.comments.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "comment" + (i === hlIdx ? " hl" : "");
    d.innerHTML = "<span class='ts'>[" + fmtTime(c.sec) + "]</span>" + c.text.replace(/[<>&]/g, (ch) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[ch]));
    wrap.appendChild(d);
  });
  if (!state.comments.length) wrap.innerHTML = "<div class='sub'>No notes in this tape yet.</div>";
}
let holdTimer = null, held = false;
const balloon = $("btnComment");
balloon.addEventListener("pointerdown", () => {
  held = false;
  holdTimer = setTimeout(() => { held = true; openCommentList(); }, 450);
});
["pointerup", "pointerleave"].forEach((ev) => balloon.addEventListener(ev, () => clearTimeout(holdTimer)));
balloon.addEventListener("click", () => { if (!held) openCommentInput(); });
function openCommentInput() {
  if (!audio.src) return;
  $("inputAt").textContent = "at " + fmtTime(audio.currentTime) + " in " + $("trackName").textContent;
  $("commentText").value = "";
  $("inputOverlay").classList.remove("hidden");
  setTimeout(() => $("commentText").focus(), 50);
}
function openCommentList() {
  renderComments(audio.currentTime || null);
  $("listOverlay").classList.remove("hidden");
}
$("btnCancelComment").addEventListener("click", () => $("inputOverlay").classList.add("hidden"));
$("btnCloseList").addEventListener("click", () => $("listOverlay").classList.add("hidden"));
[$("inputOverlay"), $("listOverlay")].forEach((ov) => ov.addEventListener("click", (e) => { if (e.target === ov) ov.classList.add("hidden"); }));
$("btnSaveComment").addEventListener("click", saveComment);
$("commentText").addEventListener("keydown", (e) => { if (e.key === "Enter") saveComment(); });
async function saveComment() {
  const text = $("commentText").value.trim();
  if (!text) return $("inputOverlay").classList.add("hidden");
  const folder = state.folders[state.folderIdx];
  state.comments.push({ sec: Math.floor(audio.currentTime), text });
  state.comments.sort((a, b) => a.sec - b.sec);
  $("inputOverlay").classList.add("hidden");
  renderComments(audio.currentTime);
  if (!state.token) {
    alert("To save notes to Drive you need to sign in first (LOG IN button).\nThe note is kept on this device only for now.");
  }
  await persistComments(folder);
}
async function persistComments(folder) {
  const md = commentsAsMd();
  if (!state.token) return localStorage.setItem("mlComments_" + folder.id, md);
  try {
    if (!state.commentsFileId) {
      const meta = await (await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
        method: "POST",
        headers: { Authorization: "Bearer " + state.token },
        body: makeMultipart(md, folder.id),
      })).json();
      if (!meta.id) throw new Error("create failed");
      state.commentsFileId = meta.id;
    } else {
      await fetch("https://www.googleapis.com/upload/drive/v3/files/" + state.commentsFileId + "?uploadType=media", {
        method: "PATCH",
        headers: { Authorization: "Bearer " + state.token, "Content-Type": "text/markdown" },
        body: md,
      });
    }
    localStorage.removeItem("mlComments_" + folder.id);
  } catch (e) {
    alert("Saving to Drive failed (" + (e.message || e) + "). The note is kept locally.");
    localStorage.setItem("mlComments_" + folder.id, md);
  }
}
function makeMultipart(md, folderId) {
  const boundary = "ml" + Date.now();
  const head = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
    JSON.stringify({ name: MD_NAME, mimeType: "text/markdown", parents: [folderId] }) +
    "\r\n--" + boundary + "\r\nContent-Type: text/markdown\r\n\r\n";
  return new Blob([head + md + "\r\n--" + boundary + "--"]);
}

/* ---------- Google Identity Services OAuth ---------- */
let gisPromise = null;
function getToken() {
  return new Promise((resolve, reject) => {
    const use = () => {
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: state.clientId,
        scope: "https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file",
        callback: (r) => r.access_token ? resolve(r.access_token) : reject(new Error("no token received")),
      });
      client.requestAccessToken({ prompt: "" }); // silent reuse of earlier consent when possible
    };
    if (window.google && window.google.accounts && window.google.accounts.oauth2) return use();
    if (!gisPromise) {
      gisPromise = new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = "https://accounts.google.com/gsi/client";
        s.onload = res; s.onerror = () => rej(new Error("Google sign-in script failed to load"));
        document.head.appendChild(s);
      });
    }
    gisPromise.then(use).catch(reject);
  });
}

/* ---------- Token session cache ---------- */
function saveToken(t) {
  try { sessionStorage.setItem("mlToken", t); sessionStorage.setItem("mlTokenTs", String(Date.now())); } catch (e) {}
}
function getSavedToken() {
  try {
    const t = sessionStorage.getItem("mlToken");
    const ts = parseInt(sessionStorage.getItem("mlTokenTs") || "0", 10);
    if (t && Date.now() - ts < 50 * 60 * 1000) return t;
    sessionStorage.removeItem("mlToken"); sessionStorage.removeItem("mlTokenTs");
  } catch (e) {}
  return null;
}
function clearToken() {
  state.token = null;
  try { sessionStorage.removeItem("mlToken"); sessionStorage.removeItem("mlTokenTs"); } catch (e) {}
}

/* ---------- Buttons & init ---------- */
$("btnSettings").addEventListener("click", () => {
  const ov = $("setupOverlay");
  if (ov.classList.contains("hidden")) openSetup();
  else ov.classList.add("hidden");
});
function openSetup() { $("setupOverlay").classList.remove("hidden"); $("setupDetails").open = true; }
$("btnCloseSetup").addEventListener("click", () => $("setupOverlay").classList.add("hidden"));
$("setupOverlay").addEventListener("click", (e) => { if (e.target === $("setupOverlay")) $("setupOverlay").classList.add("hidden"); });
$("btnDoLogin").addEventListener("click", async () => {
  try {
    saveSetup();
    state.token = await getToken();
    saveToken(state.token);
    state.mode = "mixed";
    begin();
  } catch (e) { msg("Sign-in failed: " + e.message, false); }
});
$("btnPubOnly").addEventListener("click", () => { saveSetup(); begin(); });

(function init() {
  $("versionTag").textContent = APP_VERSION;
  const t = CONFIG.tenant && !CONFIG.tenant.startsWith("HIER-JOUW-") ? CONFIG.tenant : "moly";
  $("loginTenant").textContent = t;
  document.title = t;                                   // tab title = tenant; Moly is the engine
  const manifest = JSON.parse(decodeURIComponent(document.querySelector("link[rel=manifest]").href.replace(/^data:application\/manifest\+json,/, "")));
  manifest.name = t; manifest.short_name = t;
  document.querySelector("link[rel=manifest]").href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
  const filled = ($("folderUrl").value.trim() && !$("folderUrl").value.includes("HIER-JOUW-")) ||
                ($("publicFolderUrl").value.trim() && !$("publicFolderUrl").value.includes("HIER-JOUW-"));
  if (filled) autoStart();
  else { openSetup(); }
})();
</script>
</body>
